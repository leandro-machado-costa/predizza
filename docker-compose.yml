# Evolution API — WhatsApp para a Predizza (dev local)
# Uso: docker compose up -d
# Depois: crie a instância, escaneie o QR e aponte o webhook para
#   https://SEU_HOST/api/whatsapp/webhook  (ou tunnel ngrok/cloudflared)
#
# Docs: https://doc.evolution-api.com

services:
  evolution-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    restart: unless-stopped

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    ports:
      - "8085:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: http://localhost:8085
      AUTHENTICATION_API_KEY: predizza-evolution-key
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      LOG_LEVEL: ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-postgres
      - evolution-redis
    restart: unless-stopped

volumes:
  evolution_pg:
  evolution_instances:
