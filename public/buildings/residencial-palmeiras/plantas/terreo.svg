<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Planta do térreo">
  <rect width="800" height="560" fill="#f4f1ea"/>
  <rect x="40" y="40" width="720" height="480" fill="#fffdf8" stroke="#1c2430" stroke-width="3"/>
  <!-- Portaria -->
  <rect x="60" y="360" width="180" height="140" fill="#e7efe9" stroke="#0f6e56" stroke-width="2"/>
  <text x="150" y="435" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" fill="#1c2430">Portaria</text>
  <!-- Salão -->
  <rect x="520" y="340" width="220" height="160" fill="#f6e7d8" stroke="#c45c26" stroke-width="2"/>
  <text x="630" y="425" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" fill="#1c2430">Salão de festas</text>
  <!-- Zeladoria -->
  <rect x="60" y="180" width="160" height="120" fill="#eef1f4" stroke="#5b6573" stroke-width="2"/>
  <text x="140" y="245" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="15" fill="#1c2430">Zeladoria</text>
  <!-- Hall -->
  <rect x="280" y="250" width="240" height="100" fill="#f0f4f2" stroke="#1c2430" stroke-width="2"/>
  <text x="400" y="305" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" fill="#1c2430">Hall social</text>
  <!-- Elevadores -->
  <rect x="340" y="160" width="80" height="70" fill="#d8e2dc" stroke="#0f6e56" stroke-width="2"/>
  <text x="380" y="200" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" fill="#1c2430">Elev.</text>
  <!-- Escada -->
  <rect x="440" y="160" width="60" height="70" fill="#e8e0d4" stroke="#5b6573" stroke-width="2"/>
  <text x="470" y="200" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" fill="#1c2430">Esc.</text>
  <!-- Bike -->
  <rect x="60" y="60" width="200" height="90" fill="#eef1f4" stroke="#5b6573" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="15" fill="#1c2430">Bicicletário</text>
  <!-- Lixo -->
  <rect x="560" y="60" width="180" height="90" fill="#f6e7d8" stroke="#c45c26" stroke-width="2"/>
  <text x="650" y="110" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="15" fill="#1c2430">DML / lixo</text>
  <text x="400" y="30" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" fill="#1c2430">Térreo — Residencial Palmeiras</text>
</svg>
