<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Planta do pavimento tipo">
  <rect width="800" height="560" fill="#f4f1ea"/>
  <rect x="40" y="40" width="720" height="480" fill="#fffdf8" stroke="#1c2430" stroke-width="3"/>
  <!-- Aptos -->
  <rect x="60" y="60" width="280" height="180" fill="#e7efe9" stroke="#0f6e56" stroke-width="2"/>
  <text x="200" y="150" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="18" fill="#1c2430">Apto 01</text>
  <rect x="460" y="60" width="280" height="180" fill="#e7efe9" stroke="#0f6e56" stroke-width="2"/>
  <text x="600" y="150" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="18" fill="#1c2430">Apto 02</text>
  <rect x="60" y="320" width="280" height="180" fill="#e7efe9" stroke="#0f6e56" stroke-width="2"/>
  <text x="200" y="415" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="18" fill="#1c2430">Apto 03</text>
  <rect x="460" y="320" width="280" height="180" fill="#e7efe9" stroke="#0f6e56" stroke-width="2"/>
  <text x="600" y="415" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="18" fill="#1c2430">Apto 04</text>
  <!-- Circulação -->
  <rect x="280" y="240" width="240" height="80" fill="#f0f4f2" stroke="#1c2430" stroke-width="2"/>
  <text x="400" y="286" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="15" fill="#1c2430">Hall</text>
  <rect x="340" y="170" width="70" height="70" fill="#d8e2dc" stroke="#0f6e56" stroke-width="2"/>
  <text x="375" y="210" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" fill="#1c2430">Elev.</text>
  <rect x="430" y="170" width="55" height="70" fill="#e8e0d4" stroke="#5b6573" stroke-width="2"/>
  <text x="457" y="210" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" fill="#1c2430">Esc.</text>
  <rect x="280" y="170" width="50" height="70" fill="#eef1f4" stroke="#5b6573" stroke-width="2"/>
  <text x="305" y="210" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" fill="#1c2430">Shaft</text>
  <text x="400" y="30" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" fill="#1c2430">Pavimento tipo — 4 unidades</text>
</svg>
